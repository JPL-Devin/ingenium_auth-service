swagger: "2.0"
info:
  version: "0.0.1"
  title: Ingenium Auth Management
  description: This is where the permissions, roles, and scopes will be created and edited. It will interface with the auth-z database to store this information.
# during dev, should point to your local machine
host: 100.64.153.42
# basePath prefixes all resource paths
basePath: /api/v2
#
schemes:
  # tip: remove http to make production-grade
  - https
# format of bodies a client can send (Content-Type)
consumes:
  - application/json
# format of the responses to the client (Accepts)
produces:
  - application/json

securityDefinitions:
  ingenium_auth:
    type: oauth2
    authorizationUrl: www.sample.com
    flow: implicit
    scopes:
      admin: Administrative permission such as adding venues, managing users, etc.
      execute:wsts: Execute procedures on WSTS Venues
      execute:testbed: Execute procedures on Testbed Venues
      execute:sit: Execute procedures on System I&T Venues
      execute:other: Execute procedures on other Venues
      config_mgmt: Make changes to project configurations such as command dictionary
      redline: Approve redline 
      author: Create and update procedures     
      basic: basic level permission that includes authoring procedure, watching execution, adding comments
  basicAuth:
    type: basic
    description: Basic authentication (username, password)

security:
  - ingenium_auth:
    - admin

paths:
  /login:
    x-swagger-router-controller: authentication
    get:
      security:
        - basicAuth: []
      summary: Log in user.
      description: |
        Logs in user and returns a jwt access tokens and token timeout info.
      operationId: login
      responses:
        200:
          description: Successful Response
          schema:
            type: object
            properties:
              access_token:
                type: string
              access_token_timeout:
                type: string
        404:
          description: Error - User does not exist
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Wrong password or unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: Something else went wrong
          schema:
            $ref: '#/definitions/ErrorResponse'

  /refresh_token:
    x-swagger-router-controller: authentication
    post:
      summary: get a new api token
      description: Given a refresh token, will return a new api token that will expire in 60 minutes.
        The refresh token will be passed in the header
      operationId: refresh_token
      security:
        - ingenium_auth:
          - basic
      responses:
        200:
          description: return a new api token that will expire in 60 minutes
          schema:
            type: object
            properties:
              access_token:
                type: string
              access_token_timeout:
                type: string
        401:
          description: invalid refresh token
          schema:
            $ref: '#/definitions/ErrorResponse'
        403:
          description: token expired long expire (12 hr expire)
          schema: 
            $ref: '#/definitions/ErrorResponse'
        default:
          description: Something else went wrong
          schema:
            $ref: '#/definitions/ErrorResponse'

  /logout:
    x-swagger-router-controller: authentication
    post:
      summary: Log out a user
      description: Logs out a user. Returns 200 OK or 500 error. add this user's tokens to the blacklisted token list to prevent tokens from being used again.
      operationId: logout
      security:
        - ingenium_auth:
          - basic
      responses:
        200:
          description: Successful response, user was logged out
        default:
          description: Something bad happened, user may not have been logged out properly
          schema:
            $ref: '#/definitions/ErrorResponse'

  ############################
  ###         ROLES        ###
  ############################

  /roles:
    x-swagger-router-controller: role
    get:
      tags:
        - role
      description: Get all roles
      operationId: get_all_roles
      parameters:
        - name: name
          in: query
          description: filter by role name
          type: string
        - name: venue_group_id
          in: query
          description: filter by venue_group_id
          type: string
        - name: offset
          in: query
          description: offset for the pagination
          type: integer
        - name: limit
          in: query
          description: result limit
          type: integer
        - name: order
          in: query
          description: ascending or descending order of role name
          type: string
          enum:
            - ASC
            - DESC

      responses:
        200:
          description: Success. a list of all of the roles (id, name, description)
          schema:
            type: object
            properties:
              total:
                type: integer
              results:
                type: array
                items:
                  $ref: "#/definitions/role_id_name_description"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

    post:
      tags:
        - role
      description: Creates a new role
      operationId: create_role
      parameters:
        - name: data
          in: body
          description: the name, description (optional), users, groups, permissions of the role to add to the system
          required: true
          schema:
            $ref: '#/definitions/role_post'
      responses:
        201:
          description: Created role successfully. returns role that was just created.
          schema:
            $ref: "#/definitions/role_info"
        400:
          description: Bad Request. Used if role name is not provided or is a duplicate.
          schema:
            $ref: "#/definitions/ErrorResponse"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"


  /roles/{role_id}:
    x-swagger-router-controller: role
    get:
      tags:
        - role
      description: Retrieve id, name, description, users, groupnames, and permission ids for a single existing role
      operationId: get_role
      parameters:
        - $ref: "#/parameters/role_id"
      responses:
        200:
          description: Role retrieved sucessfully
          schema:
            $ref: "#/definitions/role_full_info"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Role not found
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

    put:
      tags:
        - role
      description: Edit an existing role with id
      operationId: edit_role
      parameters:
        - $ref: "#/parameters/role_id"
        - name: data
          in: body
          description: the name, description (optional), users, groups, permissions of the role in the system
          required: true
          schema:
            $ref: '#/definitions/role_post'

      responses:
        200:
          description: Role edited successfully, returns role just edited.
          schema:
            $ref: "#/definitions/role_full_info"
        404:
          description: Role chosen to edit does not exist
          schema:
            $ref: "#/definitions/ErrorResponse"
        400:
          description: Request is malformed
          schema:
            $ref: "#/definitions/ErrorResponse"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

    delete:
      tags:
        - role
      description: Delete an existing role
      operationId: delete_role
      parameters:
        - $ref: "#/parameters/role_id"
      responses:
        204:
          description: Role successfully deleted.
        404:
          description: Role chosen for deletion does not exist
          schema:
            $ref: "#/definitions/ErrorResponse"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error - Role may not have been successfully deleted.
          schema:
            $ref: "#/definitions/ErrorResponse"

  ############################
  ### ROLES - PERMISSIONS  ###
  ############################

  /roles/{role_id}/permissions:
    x-swagger-router-controller: role
    get:
      tags:
        - role
      description: retrieve all permissions for an existing role
      operationId: get_role_permissions
      parameters:
        - $ref: '#/parameters/role_id'
      responses:
        200:
          description: Success. a list of the permissions that are in this role (name, id)
          schema:
            $ref: "#/definitions/permission_name_id_list"
        404:
          description: Role not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"
    put:
      tags:
        - role
      description: Edit permissions for an existing role to permissions corresponding to given ids
      operationId: edit_role_permissions
      parameters:
        - $ref: '#/parameters/role_id'
        - name: data
          in: body
          required: true
          description: The ids of desired permissions for this role
          schema:
            type: array
            items:
              type: integer
      responses:
        200:
          description: success.
          schema:
            $ref: "#/definitions/permission_name_id_list"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Role not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  /roles/{role_id}/permissions/{permission_id}:
    x-swagger-router-controller: role
    delete:
      tags:
        - role
      description: delete a single permission from a role
      operationId: delete_role_permission
      parameters:
        - $ref: '#/parameters/role_id'
        - $ref: '#/parameters/permission_id'
      responses:
        200:
          description: Successfully deleted.
        404:
          description: permission requested for deletion does not exist in system
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  ############################
  ###     ROLES - GROUPS   ###
  ############################

  /roles/{role_id}/groups:
    x-swagger-router-controller: role
    get:
      tags:
        - role
      description: retrive a list of groupnames that have this role
      operationId: get_role_groups
      parameters:
        - $ref: '#/parameters/role_id'
      responses:
        200:
          description: Success. a list of groups that belong to this role
          schema:
            type: array
            items:
              $ref: "#/definitions/group"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Role not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

    put:
      tags:
        - role
      description: edit the list of groups for this role
      operationId: edit_role_groups
      parameters:
        - $ref: '#/parameters/role_id'
        - name: data
          in: body
          required: true
          description: the list of desired group names for this role
          schema:
            type: array
            items:
              type: string
      responses:
        200:
          description: success. The updated list of group names and ids for this role
          schema:
            type: array
            items:
              $ref: '#/definitions/group'
        404:
          description: one or more group names don't exist in the system
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  /roles/{role_id}/groups/{group_id}:
    x-swagger-router-controller: role
    delete:
      tags:
        - role
      description: delete a group from the specified role
      operationId: delete_role_group
      parameters:
        - $ref: '#/parameters/role_id'
        - name: group_id
          in: path
          required: true
          description: the id of the group you wish to remove from this role
          type: string
      responses:
        204:
          description: success.
        404:
          description: the group name doesn't exist in the system
          schema:
            $ref: '#/definitions/ErrorResponse'
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  ############################
  ###     ROLES - USERS    ###
  ############################
  /roles/{role_id}/users:
    x-swagger-router-controller: role
    get:
      tags:
        - role
      description: Retrieve a list of userids and usernames for the users that are explictly assigned to this this role (not including users contained via groups assigned to the role)
      operationId: get_role_users
      parameters:
        - $ref: '#/parameters/role_id'
      responses:
        200:
          description: Success. a list of the usernames and user ids for this role
          schema:
            type: array
            items:
              $ref: '#/definitions/user'
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Role not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

    put:
      tags:
        - role
      description: edit the list of users for this role
      operationId: edit_role_users
      parameters:
        - $ref: '#/parameters/role_id'
        - name: data
          in: body
          required: true
          description: the list of desired usernames for this role
          schema:
            type: array
            items:
              type: string

      responses:
        200:
          description: success. the updated list of users for this role
          schema:
            type: array
            items:
              $ref: '#/definitions/user'
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Role not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  /roles/{role_id}/users/{user_id}:
    x-swagger-router-controller: role
    delete:
      tags:
        - role
      description: delete a user from the role
      operationId: delete_role_user
      parameters:
        - $ref: '#/parameters/role_id'
        - $ref: '#/parameters/user_id'
      responses:
        204:
          description: success. the user was deleted from the role
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Role not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"


  ############################
  ###     PERMISSIONS      ###
  ############################

  /permissions:
    x-swagger-router-controller: permission
    get:
      tags:
        - permission
      description: Get all permission ids and names
      operationId: get_all_permissions
      responses:
        200:
          description: success. returns a list of all permissions
          schema:
             $ref: '#/definitions/permission_name_id_list'
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  /permissions/{permission_id}:
    x-swagger-router-controller: permission
    get:
      tags:
        - permission
      description: Retrieve name, id, createdAt and updatedAt values for an existing permission
      operationId: get_permission
      parameters:
        - $ref: "#/parameters/permission_id"
      responses:
        200:
          description: Permission retrieved sucessfully
          schema:
            $ref: "#/definitions/permission"
        404:
          description: Permission not found
          schema:
            $ref: "#/definitions/ErrorResponse"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  /permissions/{permission_id}/users:
    x-swagger-router-controller: permission
    get:
      tags:
        - permission
      description: Get a list of userids and user names that have this permission
      operationId: get_users_for_permission
      parameters:
        - $ref: '#/parameters/permission_id'
      responses:
        200:
          description: Success. a list of user ids and user names that have this permission
          schema:
            type: array
            items:
              $ref: '#/definitions/user'
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Permission not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: General Error - Permission may not have been successfully deleted.
          schema:
            $ref: "#/definitions/ErrorResponse"

  /permissions/{permission_id}/groups:
    x-swagger-router-controller: permission
    get:
      tags:
        - permission
      description: Get a list of group ids and group names that have this permission
      operationId: get_groups_for_permission
      parameters:
        - $ref: '#/parameters/permission_id'
      responses:
        200:
          description: Success. a list of group ids and group names that have this permission
          schema:
            type: array
            items:
              $ref: '#/definitions/group'
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Permission not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        default:
          description: General Error - Permission may not have been successfully deleted.
          schema:
            $ref: "#/definitions/ErrorResponse"

  ############################
  ###         USERS        ###
  ############################
  /users:
    x-swagger-router-controller: user
    get:
      tags:
        - user
      description: Get all users who are currently assigned to roles in Ingenium (regardless if they have this via group or direct permission)
      operationId: get_all_users
      parameters:
        - name: limit
          in: query
          description: result limit
          type: integer
          #### default: 20
        - name: q
          in: query
          description: limits results to users that have usernames that begin with string in q
          type: string
        - name: offset
          in: query
          description: offset for the pagination
          type: integer
        - name: order
          in: query
          description: ascending or descending order of usernames
          type: string
          enum:
            - ASC
            - DESC
        - name: loggedin
          in: query
          description: Limit the results to users that are logged in.
          type: string
          enum:
            - Yes
            - No
        - name: rolefilter
          in: query 
          description: Limit the results to users that have roles starting with string in rolefilter.
          type: string
        - name: scopefilter
          in: query
          description: Limit the results to users that have scopes starting with string scopefilter.
          type: string
        - name: groupfilter
          in: query
          description: Limit the results to users that have groups starting with string in groupfilter.
          type: string
      responses:
        200:
          description: Success. a list of all of the users
          schema:
            type: object
            properties:
              total:
                type: integer
              results:
                type: array
                items:
                  $ref: "#/definitions/user"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  /users/{user_id}:
    x-swagger-router-controller: user
    get:
      tags:
        - user
      description: Get user
      operationId: get_user
      parameters:
        - $ref: "#/parameters/user_id"
      responses:
        200:
          description: Success. The name, id, and display name for a specific user
          schema:
            $ref: "#/definitions/user"
        404:
          description: Not found
          schema:
            $ref: "#/definitions/ErrorResponse"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  ############################
  ###         GROUPS       ###
  ############################
  /groups:
    x-swagger-router-controller: group
    get:
      tags:
        - group
      description: Get all groups that are currently assigned to any role within Ingenium
      operationId: get_all_groups
      parameters:
        - name: limit
          in: query
          description: result limit
          type: integer
          #### default: 20
        - name: q
          in: query
          description: limits results to groups that have names that begin with string in q
          type: string
        - name: offset
          in: query
          description: offset for the pagination
          type: integer
        - name: order
          in: query
          description: ascending or descending order of group names
          type: string
          enum:
            - ASC
            - DESC
        - name: rolefilter
          in: query
          description: Limit the results to groups that have roles starting with string in rolefilter.
          type: string
        - name: userfilter
          in: query
          description: Limit the results to groups that have users starting with string in userfilter.
          type: string
        - name: scopefilter
          in: query
          description: Limit the results to groups that have scopes starting with string in scopefilter.
          type: string

      responses:
        200:
          description: Success. a list of all of the groups
          schema:
            type: object
            properties:
              total:
                type: integer
              results:
                type: array
                items:
                  $ref: "#/definitions/group"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  /groups/{group_id}:
    x-swagger-router-controller: group
    get:
      tags:
        - group
      description: Get group
      operationId: get_group
      parameters:
        - $ref: "#/parameters/group_id"
      responses:
        200:
          description: Success. The name, id, createdAt, updatedAt of a group
          schema:
            $ref: "#/definitions/group"
        404:
          description: Not found
          schema:
            $ref: "#/definitions/ErrorResponse"
        401:
          description: Unauthorized (credentials provided, user doesn't have access to resource)
          schema:
            $ref: "#/definitions/ErrorResponse"
        403:
          description: Forbidden (improper or no credentials provided)
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  ############################
  ###        LDAP          ###
  ############################
  /ldap/groups:
    get:
      tags:
        - ldap
      description: search for groups in ldap (used for autocomplete)
      operationId: search_groups
      x-swagger-router-controller: ldap
      security:
        - ingenium_auth:
          - basic
      parameters:
        - name: q
          in: query
          description: limits results to groups that have names that begin with string in q
          type: string
          required: true
      responses:
        200:
          description: an array of ldap group names that match the query
          schema:
            type: array
            items:
              type: string
        401:
          description: Bearer [token] in authorization header.
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Couldn't find groups.
          schema:
            $ref: "#/definitions/ErrorResponse"
        500:
          description: Internal Server Error.
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"
  /ldap/users:
    get:
      tags:
        - ldap
      description: search forusers in ldap (used for autocomplete)
      operationId: search_users
      x-swagger-router-controller: ldap
      security:
        - ingenium_auth:
          - basic
      parameters:
        - name: q
          in: query
          description: limits results to users that have usernames that begin with string in q
          type: string
          required: true
      responses:
        200:
          description: an array of ldap user names that match the query
          schema:
            type: array
            items:
              type: object
              properties:
                username:
                  type: string
                displayName:
                  type: string
        401:
          description: Bearer [token] in authorization header.
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: Couldn't find users.
          schema:
            $ref: "#/definitions/ErrorResponse"
        500:
          description: Internal Server Error.
          schema:
            $ref: "#/definitions/ErrorResponse"
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  ############################
  ###       LOGGING        ###
  ############################
  /health:
    get:
      tags:
        - logging
      description: is the server up?
      x-swagger-router-controller: logging
      operationId: health
      security: []
      responses:
        200:
          description: Success
          schema:
            $ref: "#/definitions/ErrorResponse"          

  /logging:
    get:
      x-swagger-router-controller: logging
      operationId: loglevelGET
      tags:
        - logging
      description: get the current log level for the auth service
      responses:
        200:
          description: OK
          schema:
            type: string
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"
    post:
      x-swagger-router-controller: logging
      operationId: loglevelPOST
      tags:
        - logging
      description: change the log level for the auth service
      parameters:
        - name: data
          in: body
          required: true
          schema:
            type: object
      responses:
        204:
          description: OK, log level was changed
        default:
          description: General Error
          schema:
            $ref: "#/definitions/ErrorResponse"

  /swagger:
    x-swagger-pipe: swagger_raw

